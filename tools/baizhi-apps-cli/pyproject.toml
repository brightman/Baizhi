[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baizhi-apps-cli"
version = "0.1.0"
description = "Standalone CLI for Baizhi Apps platform APIs"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "keyring>=25"]

[project.scripts]
baizhi-apps = "baizhi_apps_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
